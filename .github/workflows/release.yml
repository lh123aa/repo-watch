name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Attach zip asset to release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build zip (source snapshot)
        run: |
          zip -qr repo-watch-${{ github.event.release.tag_name }}.zip . \
            -x ".git/*" ".github/*" "*.zip"

      - name: Upload asset to the published release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_name: repo-watch-${{ github.event.release.tag_name }}.zip
          asset_path: ./repo-watch-${{ github.event.release.tag_name }}.zip
          asset_content_type: application/zip
